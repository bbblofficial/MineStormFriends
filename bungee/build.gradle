plugins { id 'com.gradleup.shadow' }

dependencies {
    compileOnly 'net.md-5:bungeecord-api:1.20-R0.2'
}

processResources {
    inputs.property('version', project.version)
    filesMatching('bungee.yml') { expand('version': project.version) }
}

jar { enabled = false }

shadowJar {
    archiveBaseName = 'MineStormFriends-Bungee'
    archiveClassifier = ''
}
build.dependsOn shadowJar
