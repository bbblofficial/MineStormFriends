# MineStormFriends - Created by Muvixo
options:
  friend-add-timeout: 5          # minutes until a request expires
  max-friends: 25                # default limit
  use-permission-limits: true    # honour minestormfriends.limit.<n>
  lookup-timeout-ticks: 100      # how long /msf add waits for the other server (20 ticks = 1 s)

storage:
  # FLATFILE | SQLITE | MYSQL   (changing this requires a restart)
  # Use MYSQL on a network so every server shares the same data.
  # The plugin creates the database and tables itself.
  type: MYSQL

  # --- fill these in for MySQL ---
  mysql:
    host: 127.0.0.1
    port: 3306
    database: minestormfriends
    username: root
    password: '199118811771456aAa!2'

    # optional overrides
    useSSL: false
    serverTimezone: UTC
    characterEncoding: utf8
    poolSize: 10
    connectionTimeoutSeconds: 5
    maxLifetimeSeconds: 1500
    keepaliveSeconds: 60

  # used only when type: SQLITE
  file: friends.db

  # How often each server re-reads the shared DB (seconds).
  # 0 = disabled. Only meaningful with MYSQL.
  refresh-interval-seconds: 5
network:
  # true  = a MineStormFriends proxy plugin (Bungee/Velocity) is installed
  # false = single server, everything is handled locally
  proxy: true
  # Unique name of THIS server (use the same name as in the proxy config)
  server-name: server
  # Packets are HMAC-signed. Use the SAME long random value on every backend.
  secret: change-me-to-a-long-random-string
